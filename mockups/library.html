<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oqestra – Library</title>

</head>
<body style="margin:0;background:#000;display:flex;justify-content:center">


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;700&amp;family=Archivo+Black&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#CFCFCF}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 0; background-color: #000000; background-image: radial-gradient(circle, #141414 0.6px, transparent 0.9px); background-size: 6px 6px; color: #FFFFFF; font-family: 'Archivo Black', sans-serif; font-weight: 300; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px">
    <h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 36px; font-weight: 400; letter-spacing: -0.01em">Library</h1>
    <button aria-label="Library settings" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
    </button>
  </div>

  <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 22px; border: 0.5px solid #333333; background: rgba(255,255,255,0.02)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search your library</span>
    <input type="search" placeholder="Albums, artists, tracks, tags" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 14px; font-weight: 300; outline: none; color: #FFFFFF">
  </label>

  <div role="tablist" aria-label="Browse by" style="display: flex; gap: 22px">
    <button role="tab" aria-selected="true" style="height: 40px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase">Albums<span style="width: 4px; height: 4px; border-radius: 2px; background: #FFFFFF"></span></button>
    <button role="tab" aria-selected="false" style="height: 40px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #9A9A9A">Artists<span style="width: 4px; height: 4px"></span></button>
    <button role="tab" aria-selected="false" style="height: 40px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #9A9A9A">Folders<span style="width: 4px; height: 4px"></span></button>
    <button role="tab" aria-selected="false" style="height: 40px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #9A9A9A">Playlists<span style="width: 4px; height: 4px"></span></button>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; font-family: Doto, monospace; font-weight: 700; font-size: 11.5px; letter-spacing: 0.08em; color: #9A9A9A; padding-bottom: 2px; border-bottom: 0.5px solid #222222">
    <span>142 ALBUMS</span>
    <span>PHONE · NAS · JELLYFIN</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px">
    <a href="now-playing.html" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #FFFFFF">
      <div role="img" aria-label="Album art placeholder" style="aspect-ratio: 1; border-radius: 2px; background: #050505; position: relative; overflow: hidden">
        <svg width="100%" height="100%" viewBox="0 0 168 168" aria-hidden="true"><defs><pattern id="a1-1" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.35" fill="#2E2E2E"></circle></pattern><pattern id="a1-2" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.75" fill="#8A8A8A"></circle></pattern><pattern id="a1-3" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF"></circle></pattern></defs><rect width="168" height="168" fill="url(#a1-1)"></rect><circle cx="98" cy="78" r="56" fill="#050505"></circle><circle cx="98" cy="78" r="56" fill="url(#a1-2)"></circle><circle cx="92" cy="72" r="28" fill="#050505"></circle><circle cx="92" cy="72" r="28" fill="url(#a1-3)"></circle></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-family: 'Archivo Black', sans-serif; font-size: 12px">Low Tide Signals</span>
        <span style="display: flex; justify-content: space-between; font-size: 12px; color: #9A9A9A">Harbour Lights<span style="font-family: Doto, monospace; font-weight: 700; color: #FFFFFF">24/96</span></span>
      </div>
    </a>
    <a href="now-playing.html" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #FFFFFF">
      <div role="img" aria-label="Album art placeholder" style="aspect-ratio: 1; border-radius: 2px; background: #EDEDED; position: relative; overflow: hidden">
        <svg width="100%" height="100%" viewBox="0 0 168 168" aria-hidden="true"><defs><pattern id="a2-1" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.05" fill="#000000"></circle></pattern><pattern id="a2-2" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.55" fill="#000000"></circle></pattern></defs><path d="M84 28 L134 132 L34 132 Z" fill="url(#a2-1)"></path><path d="M84 66 L112 124 L56 124 Z" fill="#EDEDED"></path><path d="M84 66 L112 124 L56 124 Z" fill="url(#a2-2)"></path><line x1="34" y1="142" x2="134" y2="142" stroke="#000000" stroke-width="0.5"></line></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-family: 'Archivo Black', sans-serif; font-size: 12px">Glass Architecture</span>
        <span style="display: flex; justify-content: space-between; font-size: 12px; color: #9A9A9A">The Quiet Rooms<span style="font-family: Doto, monospace; font-weight: 700; color: #FFFFFF">DSD64</span></span>
      </div>
    </a>
    <a href="now-playing.html" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #FFFFFF">
      <div role="img" aria-label="Album art placeholder" style="aspect-ratio: 1; border-radius: 2px; background: #050505; position: relative; overflow: hidden">
        <svg width="100%" height="100%" viewBox="0 0 168 168" aria-hidden="true"><defs><pattern id="a3-1" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF"></circle></pattern><pattern id="a3-2" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.8" fill="#9A9A9A"></circle></pattern><pattern id="a3-3" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.5" fill="#5A5A5A"></circle></pattern><pattern id="a3-4" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.3" fill="#3A3A3A"></circle></pattern></defs><rect width="168" height="42" fill="url(#a3-1)"></rect><rect y="42" width="168" height="42" fill="url(#a3-2)"></rect><rect y="84" width="168" height="42" fill="url(#a3-3)"></rect><rect y="126" width="168" height="42" fill="url(#a3-4)"></rect><circle cx="118" cy="62" r="18" fill="#050505"></circle></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-family: 'Archivo Black', sans-serif; font-size: 12px">Desert Radio</span>
        <span style="display: flex; justify-content: space-between; font-size: 12px; color: #9A9A9A">Marrow &amp; Pine<span style="font-family: Doto, monospace; font-weight: 700; color: #FFFFFF">16/44</span></span>
      </div>
    </a>
    <a href="now-playing.html" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #FFFFFF">
      <div role="img" aria-label="Album art placeholder" style="aspect-ratio: 1; border-radius: 2px; background: #050505; position: relative; overflow: hidden">
        <svg width="100%" height="100%" viewBox="0 0 168 168" aria-hidden="true"><g fill="none" stroke-linecap="round"><circle cx="84" cy="84" r="64" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="0.1 3.2"></circle><circle cx="84" cy="84" r="50" stroke="#B5B5B5" stroke-width="1.4" stroke-dasharray="0.1 3.2"></circle><circle cx="84" cy="84" r="36" stroke="#7A7A7A" stroke-width="1.2" stroke-dasharray="0.1 3.2"></circle><circle cx="84" cy="84" r="22" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="0.1 3.2"></circle></g><circle cx="84" cy="84" r="3" fill="#FFFFFF"></circle></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-family: 'Archivo Black', sans-serif; font-size: 12px">Arches</span>
        <span style="display: flex; justify-content: space-between; font-size: 12px; color: #9A9A9A">Northfield Ensemble<span style="font-family: Doto, monospace; font-weight: 700; color: #FFFFFF">24/192</span></span>
      </div>
    </a>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column">
    <a href="now-playing.html" style="display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 10px 0 8px; border-radius: 31px; border: 0.5px solid #333333; background: rgba(12,12,12,0.92); text-decoration: none; color: #FFFFFF">
      <span aria-hidden="true" style="width: 46px; height: 46px; border-radius: 23px; background-color: #050505; background-image: radial-gradient(circle, #FFFFFF 0.9px, transparent 1.2px); background-size: 3px 3px"></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Archivo Black', sans-serif; font-size: 17px">Night Swimming</span>
        <span style="font-family: Doto, monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.06em; color: #9A9A9A">FLAC 24/96 · BIT-PERFECT</span>
      </span>
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#000000" role="img" aria-label="Pause"><rect x="7" y="5" width="2.5" height="14"></rect><rect x="14.5" y="5" width="2.5" height="14"></rect></svg>
      </span>
    </a>
    <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 72px; align-items: center">
      <a href="now-playing.html" style="display: flex; flex-direction: column; align-items: center; gap: 7px; text-decoration: none; color: #9A9A9A; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase">Home<span style="width: 4px; height: 4px"></span></a>
      <a href="library.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 7px; text-decoration: none; color: #FFFFFF; font-size: 10px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase">Library<span style="width: 4px; height: 4px; border-radius: 2px; background: #FFFFFF"></span></a>
      <a href="signal-path.html" style="display: flex; flex-direction: column; align-items: center; gap: 7px; text-decoration: none; color: #9A9A9A; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase">Signal<span style="width: 4px; height: 4px"></span></a>
      <a href="sound-eq.html" style="display: flex; flex-direction: column; align-items: center; gap: 7px; text-decoration: none; color: #9A9A9A; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase">Sound<span style="width: 4px; height: 4px"></span></a>
    </nav>
  </div>
</div>


</body>
</html>
