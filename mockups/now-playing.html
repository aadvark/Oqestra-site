<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oqestra – Now playing</title>

</head>
<body style="margin:0;background:#000;display:flex;justify-content:center">


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;700&amp;family=Archivo+Black&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#CFCFCF}
button{font:inherit;color:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 24px; background-color: #000000; background-image: radial-gradient(circle, #141414 0.6px, transparent 0.9px); background-size: 6px 6px; color: #FFFFFF; font-family: 'Archivo Black', sans-serif; font-weight: 300; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button aria-label="Collapse player" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <span style="font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase; color: #9A9A9A">Low Tide Signals</span>
    <button aria-label="More options" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg>
    </button>
  </div>

  <div role="img" aria-label="Album art placeholder" style="width: 350px; height: 350px; border-radius: 3px; overflow: hidden; background: #050505">
    <svg width="350" height="350" viewBox="0 0 350 350" aria-hidden="true">
      <defs>
        <pattern id="np-1" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.45" fill="#2E2E2E"></circle></pattern>
        <pattern id="np-2" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#6A6A6A"></circle></pattern>
        <pattern id="np-3" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#B5B5B5"></circle></pattern>
        <pattern id="np-4" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.45" fill="#FFFFFF"></circle></pattern>
      </defs>
      <rect width="350" height="350" fill="url(#np-1)"></rect>
      <circle cx="205" cy="165" r="132" fill="#050505"></circle>
      <circle cx="205" cy="165" r="132" fill="url(#np-2)"></circle>
      <circle cx="198" cy="158" r="96" fill="#050505"></circle>
      <circle cx="198" cy="158" r="96" fill="url(#np-3)"></circle>
      <circle cx="190" cy="150" r="56" fill="#050505"></circle>
      <circle cx="190" cy="150" r="56" fill="url(#np-4)"></circle>
      <line x1="32" y1="318" x2="318" y2="318" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.5"></line>
      <text x="32" y="308" fill="#9A9A9A" font-family="'Archivo Black', sans-serif" font-size="9" letter-spacing="3">ALBUM ART</text>
    </svg>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 28px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.05">Night Swimming</h1>
      <p style="margin: 0; font-size: 14px; color: #9A9A9A; letter-spacing: 0.02em">Harbour Lights</p>
    </div>
    <button aria-label="Add to favourites" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.25" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
    </button>
  </div>

  <a href="signal-path.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: Doto, monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; color: #FFFFFF">
    <span>FLAC</span><span aria-hidden="true" style="width: 3px; height: 3px; border-radius: 2px; background: #4A4A4A"></span><span>24/96</span><span aria-hidden="true" style="width: 3px; height: 3px; border-radius: 2px; background: #4A4A4A"></span><span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 5px; height: 5px; border-radius: 3px; background: #FFFFFF"></span>BIT-PERFECT</span><span aria-hidden="true" style="width: 3px; height: 3px; border-radius: 2px; background: #4A4A4A"></span><span style="color: #9A9A9A">USB</span>
  </a>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="267" aria-valuenow="102" tabindex="0" style="height: 14px">
      <svg width="350" height="14" viewBox="0 0 350 14" aria-hidden="true">
        <defs>
          <pattern id="seek-off" width="4" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="7" r="0.8" fill="#3A3A3A"></circle></pattern>
          <pattern id="seek-on" width="4" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="7" r="1.1" fill="#FFFFFF"></circle></pattern>
        </defs>
        <rect width="350" height="14" fill="url(#seek-off)"></rect>
        <rect width="132" height="14" fill="url(#seek-on)"></rect>
        <circle cx="134" cy="7" r="4" fill="#FFFFFF"></circle>
      </svg>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: Doto, monospace; font-weight: 700; font-size: 12px; color: #9A9A9A">
      <span>1:42</span><span>4:27</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Shuffle" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
    </button>
    <button aria-label="Previous track" style="width: 56px; height: 56px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="5" y="5" width="1.5" height="14"></rect><path d="M19 5v14L8.5 12z"></path></svg>
    </button>
    <button aria-label="Pause" style="width: 74px; height: 74px; border: 0; border-radius: 37px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#000000" aria-hidden="true"><rect x="7" y="5" width="2.5" height="14"></rect><rect x="14.5" y="5" width="2.5" height="14"></rect></svg>
    </button>
    <button aria-label="Next track" style="width: 56px; height: 56px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="17.5" y="5" width="1.5" height="14"></rect><path d="M5 5v14l10.5-7z"></path></svg>
    </button>
    <button aria-label="Repeat" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg>
    </button>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
    <div role="tablist" aria-label="Now playing layout" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
      <button role="tab" aria-selected="true" style="height: 44px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase">Artwork<span style="width: 4px; height: 4px; border-radius: 2px; background: #FFFFFF"></span></button>
      <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #9A9A9A">Lyrics<span style="width: 4px; height: 4px"></span></button>
      <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #9A9A9A">Visual<span style="width: 4px; height: 4px"></span></button>
      <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #9A9A9A">Hi-fi<span style="width: 4px; height: 4px"></span></button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #9A9A9A; padding-top: 12px; border-top: 0.5px solid #2A2A2A">
      <span>Studio headphones profile</span>
      <a href="library.html" style="text-decoration: none; font-family: 'Archivo Black', sans-serif; font-size: 16px">Up next · 8</a>
    </div>
  </div>
</div>


</body>
</html>
