<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oqestra – Now playing</title>

</head>
<body style="margin:0;background:#FFFFFF;display:flex;justify-content:center">


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0A0A0A}a:hover{color:#444444}
button{font:inherit;color:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 8px 20px 26px; background: #FFFFFF; color: #0A0A0A; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 56px; margin: 0 -10px">
    <a href="album.html" aria-label="Close player" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.5" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
      <span style="font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #6F6F6F">Playing from album</span>
      <span style="font-size: 13px; font-weight: 500">Low Tide Signals</span>
    </div>
    <button aria-label="Menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <span style="width: 24px; height: 1.5px; background: #0A0A0A"></span><span style="width: 24px; height: 1.5px; background: #0A0A0A"></span><span style="width: 24px; height: 1.5px; background: #0A0A0A"></span>
    </button>
  </header>

  <div role="img" aria-label="Album art placeholder" style="width: 350px; height: 350px; overflow: hidden; border-radius: 12px; background: #1E2A3F">
    <svg width="350" height="350" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#1E2A3F"></rect><circle cx="62" cy="44" r="24" fill="#E9DCC4"></circle><rect x="0" y="74" width="100" height="26" fill="#14203A"></rect><rect x="10" y="74" width="80" height="0.4" fill="#E9DCC4"></rect></svg>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <h1 style="margin: 0; font-size: 28px; font-weight: 400; letter-spacing: -0.015em; line-height: 1.1">Night Swimming</h1>
      <a href="album.html" style="font-size: 15px; color: #6F6F6F; text-decoration: none">Harbour Lights</a>
    </div>
    <button aria-label="Add to favourites" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="267" aria-valuenow="102" tabindex="0" style="height: 3px; background: #E4E4E2; position: relative">
      <div style="position: absolute; left: 0; top: 0; height: 3px; width: 38%; background: #0A0A0A"></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #6F6F6F; font-variant-numeric: tabular-nums">
      <span>1:42</span>
      <span style="font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase">FLAC · 24-bit · 96 kHz</span>
      <span>4:27</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Shuffle" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6F6F6F" stroke-width="1.5" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
    </button>
    <button aria-label="Previous track" style="width: 56px; height: 56px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#0A0A0A" aria-hidden="true"><rect x="4" y="4" width="2.5" height="16"></rect><path d="M20 4v16L8 12z"></path></svg>
    </button>
    <button aria-label="Pause" style="width: 72px; height: 72px; border: 0; border-radius: 36px; background: #0A0A0A; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    </button>
    <button aria-label="Next track" style="width: 56px; height: 56px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#0A0A0A" aria-hidden="true"><path d="M4 4v16l12-8z"></path><rect x="17.5" y="4" width="2.5" height="16"></rect></svg>
    </button>
    <button aria-label="Repeat" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6F6F6F" stroke-width="1.5" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V6h18"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v5H3"></path></svg>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 14px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F6F6F" stroke-width="1.5" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
    <div role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="66" tabindex="0" style="flex: 1; height: 2px; background: #E4E4E2; position: relative">
      <div style="position: absolute; left: 0; top: 0; height: 2px; width: 66%; background: #0A0A0A"></div>
    </div>
    <button aria-label="Queue" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
    </button>
  </div>

  <section aria-label="Up next" style="margin-top: auto; display: flex; flex-direction: column; border-top: 1px solid #E4E4E2; padding-top: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6F6F">Up next</span>
      <a href="album.html" style="font-size: 12px; text-decoration: none">View queue</a>
    </div>
    <div style="display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; height: 68px">
      <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 6px; background: #1E2A3F; position: relative; overflow: hidden"><span style="position: absolute; left: 22px; top: 9px; width: 22px; height: 22px; border-radius: 11px; background: #E9DCC4"></span><span style="position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #14203A"></span></span>
      <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; font-weight: 500">Salt Lines</span><span style="font-size: 13px; color: #6F6F6F">Harbour Lights</span></span>
      <span style="font-size: 14px; color: #6F6F6F; font-variant-numeric: tabular-nums">3:58</span>
    </div>
  </section>
</div>


</body>
</html>
