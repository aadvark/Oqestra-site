<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oqestra – Songs</title>

</head>
<body style="margin:0;background:#FFFFFF;display:flex;justify-content:center">


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0A0A0A}a:hover{color:#444444}

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0A0A0A; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 8px 20px 0">
    <span style="font-family: 'Bricolage Grotesque', 'Arial Black', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.035em; line-height: 1" role="img" aria-label="Oqestra">Øqesträ</span>
    <button aria-label="Menu" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">

    </button>
  </header>

  <nav aria-label="Collection" style="display: flex; flex-direction: column; padding: 18px 20px 0; font-size: 32px; line-height: 1.18; letter-spacing: -0.01em">

    <a href="songs.html" aria-current="page" style="text-decoration: none; display: flex; align-items: center; gap: 12px">Songs
      <svg width="18" height="16" viewBox="0 0 18 16" fill="#0A0A0A" aria-hidden="true"><rect x="0" y="6" width="2" height="4"></rect><rect x="4" y="2" width="2" height="12"></rect><rect x="8" y="0" width="2" height="16"></rect><rect x="12" y="4" width="2" height="8"></rect><rect x="16" y="6" width="2" height="4"></rect></svg>

    <a href="library.html" style="text-decoration: none; color: #8F8F8F">Artists</a>
    <a href="library.html" style="text-decoration: none; color: #8F8F8F">Playlists</a>
  </nav>

  <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; align-items: center; gap: 10px; height: 40px; border-bottom: 1px solid #0A0A0A">

    </label>
    <div style="display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; padding: 6px 0 8px; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6F6F; border-bottom: 1px solid #E4E4E2">
      <span>#</span><span>Title</span><span>Time</span>
    </div>
  </div>

  <ol aria-label="Songs" style="list-style: none; margin: 0; padding: 0 20px">
    <li style="display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; height: 58px; border-bottom: 1px solid #E4E4E2">
      <span style="font-size: 14px; color: #6F6F6F">1</span>
      <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; font-weight: 500">Afterimage</span><span style="font-size: 13px; color: #6F6F6F">The Quiet Rooms</span></span>

    </li>
    <li style="display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; height: 58px; border-bottom: 1px solid #E4E4E2">

      <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; font-weight: 500">Arches</span><span style="font-size: 13px; color: #6F6F6F">Northfield Ensemble</span></span>

    <li style="display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; height: 58px; border-bottom: 1px solid #E4E4E2">

      <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; font-weight: 500">Desert Radio</span><span style="font-size: 13px; color: #6F6F6F">Marrow &amp; Pine</span></span>
      <span style="font-size: 14px; color: #6F6F6F; font-variant-numeric: tabular-nums">4:05</span>
    </li>
    <li style="display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; height: 58px; border-bottom: 1px solid #E4E4E2">
      <svg width="10" height="12" viewBox="0 0 10 12" fill="#0A0A0A" role="img" aria-label="Now playing"><path d="M0 0v12l10-6z"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; font-weight: 600">Night Swimming</span><span style="font-size: 13px; color: #6F6F6F">Harbour Lights</span></span>
      <span style="font-size: 14px; font-variant-numeric: tabular-nums">4:27</span>
    </li>
    <li style="display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; height: 58px; border-bottom: 1px solid #E4E4E2">
      <span style="font-size: 14px; color: #6F6F6F">5</span>
      <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; font-weight: 500">Salt Lines</span><span style="font-size: 13px; color: #6F6F6F">Harbour Lights</span></span>
      <span style="font-size: 14px; color: #6F6F6F; font-variant-numeric: tabular-nums">3:58</span>
    </li>
  </ol>

  <a href="now-playing.html" style="margin-top: auto; display: flex; flex-direction: column; text-decoration: none; background: #FFFFFF">
    <span aria-hidden="true" style="display: block; height: 3px; background: #E4E4E2; position: relative"><span style="position: absolute; left: 0; top: 0; height: 3px; width: 46%; background: #0A0A0A"></span></span>
    <span style="display: flex; align-items: center; gap: 6px; height: 72px; padding: 0 12px 0 20px">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 500">Night Swimming</span>
        <span style="font-size: 13px; color: #6F6F6F">Harbour Lights</span>
      </span>
      <span style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0A0A0A" role="img" aria-label="Previous track"><rect x="4" y="4" width="2.5" height="16"></rect><path d="M20 4v16L8 12z"></path></svg></span>
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #0A0A0A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" role="img" aria-label="Pause"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg></span>
      <span style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0A0A0A" role="img" aria-label="Next track"><path d="M4 4v16l12-8z"></path><rect x="17.5" y="4" width="2.5" height="16"></rect></svg></span>
    </span>
