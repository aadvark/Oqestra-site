<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oqestra – Parametric EQ</title>

</head>
<body style="margin:0;background:#000;display:flex;justify-content:center">


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;700&amp;family=Archivo+Black&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#CFCFCF}
button{font:inherit;color:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 24px; background-color: #000000; background-image: radial-gradient(circle, #141414 0.6px, transparent 0.9px); background-size: 6px 6px; color: #FFFFFF; font-family: 'Archivo Black', sans-serif; font-weight: 300; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; height: 64px">
    <h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 44px; font-weight: 400; letter-spacing: -0.01em; line-height: 1">Sound</h1>
    <button role="switch" aria-checked="true" aria-label="Equaliser on" style="width: 48px; height: 26px; border: 0; border-radius: 13px; background: #FFFFFF; position: relative; padding: 0; margin-bottom: 6px">
      <span style="position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 10px; background: #000000"></span>
    </button>
  </div>

  <button style="display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 18px; border: 0.5px solid #333333; border-radius: 27px; background: rgba(255,255,255,0.02); text-align: left">
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase; color: #9A9A9A">Profile for this output</span>
      <span style="font-family: 'Archivo Black', sans-serif; font-size: 14px">USB DAC · Studio headphones</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
  </button>

  <div role="tablist" aria-label="Correction type" style="display: flex; gap: 24px">
    <button role="tab" aria-selected="true" style="height: 36px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase">Parametric<span style="width: 4px; height: 4px; border-radius: 2px; background: #FFFFFF"></span></button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #9A9A9A">AutoEq<span style="width: 4px; height: 4px"></span></button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #9A9A9A">Convolution<span style="width: 4px; height: 4px"></span></button>
  </div>

  <div style="border-top: 0.5px solid #2A2A2A; border-bottom: 0.5px solid #2A2A2A; padding: 12px 0 6px">
    <svg width="350" height="168" viewBox="0 0 350 168" role="img" aria-label="EQ response curve with five bands">
      <defs>
        <pattern id="eq-grid" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.4" fill="#262626"></circle></pattern>
        <pattern id="eq-fill" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.45" fill="#FFFFFF" fill-opacity="0.35"></circle></pattern>
      </defs>
      <rect width="350" height="150" fill="url(#eq-grid)"></rect>
      <line x1="0" y1="80" x2="350" y2="80" stroke="#4A4A4A" stroke-width="0.5"></line>
      <path d="M0 55 C30 55 42 56 58 58 S 100 98 122 100 S 170 70 193 68 S 225 104 246 108 S 278 62 307 60 L350 60 L350 80 L0 80 Z" fill="url(#eq-fill)"></path>
      <path d="M0 55 C30 55 42 56 58 58 S 100 98 122 100 S 170 70 193 68 S 225 104 246 108 S 278 62 307 60 L350 60" fill="none" stroke="#FFFFFF" stroke-width="1.25"></path>
      <circle cx="42" cy="56" r="6" fill="#000000" stroke="#FFFFFF" stroke-width="0.75"></circle>
      <circle cx="122" cy="100" r="6" fill="#000000" stroke="#FFFFFF" stroke-width="0.75"></circle>
      <circle cx="193" cy="68" r="7.5" fill="#FFFFFF"></circle>
      <circle cx="193" cy="68" r="13" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.6"></circle>
      <circle cx="246" cy="108" r="6" fill="#000000" stroke="#FFFFFF" stroke-width="0.75"></circle>
      <circle cx="312" cy="60" r="6" fill="#000000" stroke="#FFFFFF" stroke-width="0.75"></circle>
      <text x="2" y="164" font-family="Doto, monospace" font-weight="700" font-size="10.5" fill="#9A9A9A">20</text>
      <text x="64" y="164" text-anchor="middle" font-family="Doto, monospace" font-weight="700" font-size="10.5" fill="#9A9A9A">100</text>
      <text x="158" y="164" text-anchor="middle" font-family="Doto, monospace" font-weight="700" font-size="10.5" fill="#9A9A9A">1K</text>
      <text x="258" y="164" text-anchor="middle" font-family="Doto, monospace" font-weight="700" font-size="10.5" fill="#9A9A9A">10K</text>
      <text x="348" y="12" text-anchor="end" font-family="Doto, monospace" font-weight="700" font-size="10.5" fill="#9A9A9A">+6</text>
      <text x="348" y="146" text-anchor="end" font-family="Doto, monospace" font-weight="700" font-size="10.5" fill="#9A9A9A">−6</text>
    </svg>
  </div>

  <table style="width: 100%; border-collapse: collapse; font-size: 13px">
    <caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">EQ bands</caption>
    <thead>
      <tr style="color: #9A9A9A; font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase">
        <th scope="col" style="text-align: left; font-weight: 400; padding: 0 0 8px">Band</th>
        <th scope="col" style="text-align: right; font-weight: 400; padding: 0 0 8px">Freq</th>
        <th scope="col" style="text-align: right; font-weight: 400; padding: 0 0 8px">Gain</th>
        <th scope="col" style="text-align: right; font-weight: 400; padding: 0 0 8px">Q</th>
      </tr>
    </thead>
    <tbody style="font-family: Doto, monospace; font-weight: 700; font-size: 13px">
      <tr style="border-top: 0.5px solid #222222; height: 36px"><td style="font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 16px">Low shelf</td><td style="text-align: right">60</td><td style="text-align: right">+3.0</td><td style="text-align: right">0.71</td></tr>
      <tr style="border-top: 0.5px solid #222222; height: 36px"><td style="font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 16px">Peak</td><td style="text-align: right">250</td><td style="text-align: right">−2.0</td><td style="text-align: right">1.20</td></tr>
      <tr style="border-top: 0.5px solid #222222; height: 36px"><td style="font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 16px"><span aria-hidden="true" style="display: inline-block; width: 5px; height: 5px; border-radius: 3px; background: #FFFFFF; margin-right: 8px; vertical-align: middle"></span>Peak</td><td style="text-align: right">1.2K</td><td style="text-align: right">+1.5</td><td style="text-align: right">2.00</td></tr>
      <tr style="border-top: 0.5px solid #222222; height: 36px"><td style="font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 16px">Peak</td><td style="text-align: right">3.5K</td><td style="text-align: right">−3.0</td><td style="text-align: right">3.00</td></tr>
      <tr style="border-top: 0.5px solid #222222; height: 36px"><td style="font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 16px">High shelf</td><td style="text-align: right">10K</td><td style="text-align: right">+2.0</td><td style="text-align: right">0.71</td></tr>
    </tbody>
  </table>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding-top: 12px; border-top: 0.5px solid #2A2A2A; font-size: 12px; color: #9A9A9A">
    <span><span style="font-family: 'Archivo Black', sans-serif; font-size: 15px">Preamp</span> <span style="font-family: Doto, monospace; font-weight: 700; font-size: 13px; color: #FFFFFF">−3.5 DB</span></span>
    <span>Clip guard · 64-bit</span>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 48px; border: 0.5px solid #444444; border-radius: 24px; background: transparent; font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase">Add band</button>
    <button style="height: 48px; border: 0; border-radius: 24px; background: #FFFFFF; color: #000000; font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase">Save preset</button>
  </div>
</div>


</body>
</html>
